<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Année</title>
</head>
<body>
    <script>
    let annee = prompt("Veuillez introduire l'année :");

    if (annee !== null) {
        alert("L'année saisie est : " + annee);
    } else {
        alert("Vous avez annulé la saisie.");
    }
</script>
    
</body>
</html>

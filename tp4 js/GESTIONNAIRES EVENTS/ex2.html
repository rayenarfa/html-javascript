<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Date</title>
</head>
<body>
<hr>
<p>le date est :</p>
<h2 id="date"></h2>
<hr>
<script>
    const dateElement = document.getElementById("date");

    const maintenant = new Date();
    dateElement.textContent = maintenant.toLocaleString();
</script>

</body>
</html>
